[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbar-diffusion-study"
version = "0.1.0"
description = "Core code and aggregate evidence for a biplanar lumbar reconstruction study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
